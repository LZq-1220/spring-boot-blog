<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 - 个人博客</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">📝 我的博客</a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="javascript:void(0)" onclick="goToAdmin()" id="adminLink">管理</a>
                <a href="javascript:void(0)" onclick="handleAuthClick()" id="authLink">登录</a>
                <span id="userDisplay" style="display:none"></span>
                <a href="javascript:void(0)" onclick="logout()" id="logoutLink" style="display:none">退出</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <article id="articleContent">
            <div class="loading">加载中...</div>
        </article>

        <section class="comments-section">
            <h2>评论 (<span id="commentCount">0</span>)</h2>
            <div id="commentFormContainer" style="display:none">
                <div class="comment-form">
                    <textarea id="commentInput" rows="3" placeholder="写下你的评论..."></textarea>
                    <div class="comment-form-actions">
                        <input type="hidden" id="replyParentId" value="">
                        <span id="replyHint" style="display:none"></span>
                        <button id="submitCommentBtn">发表评论</button>
                        <button class="btn-cancel" id="cancelReplyBtn" style="display:none">取消回复</button>
                    </div>
                </div>
                <div id="loginPrompt" style="display:none">
                    <p>请先 <a href="login.html">登录</a> 后发表评论</p>
                </div>
            </div>

            <div id="commentList"></div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/post.js"></script>
</body>
</html>
